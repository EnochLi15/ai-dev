    <rect x="840" y="640" width="148" height="58" rx="6" fill="#e6f4ea" stroke="#188038" stroke-width="1.3"/>
    <line x1="188" y1="669" x2="199" y2="669" stroke="#3573d5" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="348" y1="669" x2="359" y2="669" stroke="#3573d5" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="508" y1="669" x2="519" y2="669" stroke="#3573d5" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="668" y1="669" x2="679" y2="669" stroke="#3573d5" stroke-width="1.6" marker-end="url(#arr)"/>
    <line x1="828" y1="669" x2="839" y2="669" stroke="#3573d5" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="114" y="662" font-size="12" font-weight="700" fill="#1a2b4a" text-anchor="middle">① 输入</text>
    <text x="114" y="680" font-size="10.3" fill="#3c4657" text-anchor="middle">选题 / 素材 / 模板参考</text>
    <text x="274" y="662" font-size="12" font-weight="700" fill="#1a2b4a" text-anchor="middle">② 规划</text>
    <text x="274" y="680" font-size="10.3" fill="#3c4657" text-anchor="middle">大纲 + 各页文案（agent）</text>
    <text x="434" y="662" font-size="12" font-weight="700" fill="#1a2b4a" text-anchor="middle">③ 生图</text>
    <text x="434" y="680" font-size="10.3" fill="#3c4657" text-anchor="middle">flare 探索 → sunburst 终稿</text>
    <text x="594" y="662" font-size="12" font-weight="700" fill="#1a2b4a" text-anchor="middle">④ 组装</text>
    <text x="594" y="680" font-size="10.3" fill="#3c4657" text-anchor="middle">pptwise 出 PPTX / DOCX 材料</text>
    <text x="754" y="662" font-size="12" font-weight="700" fill="#1a2b4a" text-anchor="middle">⑤ 质检</text>
    <text x="754" y="680" font-size="10.3" fill="#3c4657" text-anchor="middle">文字校对 · 数字/链接回源</text>
    <text x="914" y="662" font-size="12" font-weight="700" fill="#0d5229" text-anchor="middle">⑥ 交付</text>
    <text x="914" y="680" font-size="10.3" fill="#2d5a3d" text-anchor="middle">归档 main · 微信提醒</text>
  </g>

  <!-- problems solved -->
  <rect x="40" y="718" width="948" height="94" rx="8" fill="#fffbe6" stroke="#d4a017" stroke-width="1.4"/>
  <text x="56" y="742" font-size="13" font-weight="700" fill="#7a5c00">解决的问题（痛点 → 方案）</text>
  <text x="56" y="764" font-size="11.2" fill="#5f4b00">① 中文汇报材料视觉质量差、排版耗时 → 整页视觉稿由 gpt-image-2.5 自动生成，人工只做终审；② 风格/模板一致性 → 参考图+「只改X保持Y不变」约束迭代</text>
  <text x="56" y="783" font-size="11.2" fill="#5f4b00">③ 交付物必须可编辑 → pptwise/dsh-office-tools 生成原生 PPTX/DOCX（非截图）；④ 定时批量产出 → dsh-tasks 到点自动开新会话跑完整流水线；⑤ 成果沉淀 → 阶段性产物直接归档 ai-dev（文档/实现分离）</text>
  <text x="56" y="802" font-size="11.2" fill="#5f4b00">选型原则：不是每个都装——主链路 4 件（dsh-tasks + 本体 agent + dsh-image-gen + pptwise/office-tools），其余仅作对照与备用路线</text>
</svg>
